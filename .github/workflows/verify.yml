name: verify

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Verify pinned real repository
        run: ./scripts/verify-real-repository.sh

  frozen-java-corpus:
    needs: build
    uses: ./.github/workflows/random-java-corpus-20.yml
